<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Modals - Modularized</title>
  <style>
    /* Base Styles */
    :root {
      --primary: #00b4cc;
      --primary-dark: #008c9e;
      --background: #121212;
      --background-light: #1e1e1e;
      --text: #eeeeee;
      --text-muted: #aaaaaa;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--background);
      color: var(--text);
      margin: 0;
      padding: 0;
      line-height: 1.6;
      padding-bottom: 50px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    h1, h2, h3, h4 {
      color: var(--primary);
      margin-top: 0;
    }

    a {
      color: var(--primary);
      text-decoration: none;
    }

    button {
      background-color: var(--primary);
      color: var(--background);
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s;
      margin: 10px;
    }

    button:hover {
      background-color: var(--primary-dark);
    }

    /* Modal Styles */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      z-index: 1000;
      overflow-y: auto;
      padding: 50px 0;
    }

    .modal-content {
      background-color: var(--background-light);
      padding: 25px;
      border-radius: 10px;
      width: 90%;
      max-width: 900px;
      position: relative;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
      margin: auto;
    }

    .close-modal {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 24px;
      cursor: pointer;
      color: var(--text-muted);
      transition: color 0.3s;
    }

    .close-modal:hover {
      color: var(--primary);
    }

    /* Project Bubble Navigation Styles */
    .project-bubbles {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin: 20px 0;
    }

    .project-bubble {
      background: linear-gradient(145deg, #2a2a2a, #3d3d3d);
      color: #00b4cc;
      border: 2px solid #00b4cc;
      border-radius: 50px;
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .project-bubble:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
      background: #00b4cc;
      color: #121212;
    }

    .project-bubble.active {
      background: #00b4cc;
      color: #121212;
      transform: scale(1.05);
    }

    .mini-modal {
      display: none;
      background: rgba(18, 18, 18, 0.95);
      border: 1px solid #00b4cc;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      animation: fadeIn 0.3s ease;
    }

    .mini-modal.active {
      display: block;
    }

    .mini-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 2px solid #333;
      padding-bottom: 10px;
    }

    .mini-modal-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #00b4cc;
      margin: 0;
    }

    .close-mini-modal {
      font-size: 1.5rem;
      cursor: pointer;
      color: #777;
      transition: color 0.2s;
    }

    .close-mini-modal:hover {
      color: #00b4cc;
    }

    .mini-modal-content {
      color: #eee;
      line-height: 1.6;
    }

    .mini-modal img,
    .mini-modal video {
      width: 100%;
      border-radius: 8px;
      margin: 10px 0;
    }

    .mini-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      margin-top: 15px;
    }

    .mini-gallery img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: 6px;
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .mini-gallery img:hover {
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Preview Specific Styles */
    .preview-header {
      text-align: center;
      padding: 20px;
      background-color: var(--background-light);
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .preview-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .hidden {
      display: none;
    }

    /* Responsive Adjustments */
    @media (max-width: 768px) {
      .project-bubbles {
        gap: 8px;
      }

      .project-bubble {
        font-size: 0.8rem;
        padding: 6px 12px;
      }

      .mini-modal {
        padding: 15px;
      }

      .mini-modal-title {
        font-size: 1.1rem;
      }

      .mini-gallery {
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      }

      .mini-gallery img {
        height: 80px;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="preview-header">
    <h1>Modularized Project Modals</h1>
    <p>Now supports multiple projects with interactive bubble sections for each.</p>
  </div>

  <div class="preview-actions" id="project-buttons">
    <!-- Project buttons will be generated here -->
  </div>

  <div id="modal-container">
    <!-- Modals will be generated here -->
  </div>
</div>

<script>
  // Project Data Structure
  const projectsData = [
    {
      id: 'omnivores-rule',
      name: 'Omnivores Rule',
      tools: 'Unreal Engine, C++, HLSL',
      description: 'A surreal solarpunk exploration game that merges ecological simulation with poetic storytelling. Players shift between extractive and symbiotic recharging mechanics, unraveling ecosystem-based puzzles.',
      sections: [
        {
          id: 'gameplay',
          title: 'Core Gameplay',
          content: `
              <p>The central gameplay loop revolves around balancing extractive and symbiotic relationships with the environment:</p>
              <ul>
                <li>Players can either rapidly extract energy from plants (damaging them) or wait for symbiotic recharge (slow but sustainable)</li>
                <li>Environmental puzzles require understanding the ecosystem's interconnections</li>
                <li>Movement mechanics include vine swinging, plant climbing, and gliding</li>
              </ul>
            `,
          gallery: [
            '/api/placeholder/200/150',
            '/api/placeholder/200/150',
            '/api/placeholder/200/150'
          ]
        },
        {
          id: 'art',
          title: 'Art Direction',
          content: `
              <p>The visual style blends organic shapes with surreal elements:</p>
              <ul>
                <li>Color palette inspired by bioluminescence, with predominant cyan, magenta, and emerald green</li>
                <li>Handpainted textures combined with procedural shaders for the foliage</li>
                <li>Adaptive lighting system that responds to player actions and time of day</li>
              </ul>
            `,
          gallery: [
            '/api/placeholder/200/150',
            '/api/placeholder/200/150',
            '/api/placeholder/200/150',
            '/api/placeholder/200/150'
          ]
        },
        {
          id: 'systems',
          title: 'Systems Design',
          content: `
              <p>The game features several interconnected systems:</p>
              <ul>
                <li>Ecological simulation tracking plant health, growth cycles, and resource distribution</li>
                <li>Weather system affecting plant growth and player movement capabilities</li>
                <li>Progression system based on discovery rather than combat or traditional leveling</li>
                <li>Dynamic ecosystem responses to player actions (extraction vs. symbiosis)</li>
              </ul>
            `,
          gallery: [
            '/api/placeholder/200/150',
            '/api/placeholder/200/150'
          ]
        },
        {
          id: 'narrative',
          title: 'Narrative Design',
          content: `
              <p>The story unfolds through environmental storytelling and discovered artifacts:</p>
              <ul>
                <li>Players piece together the history of a failed ecological experiment</li>
                <li>Narrative beats revealed through plant memories accessed during symbiotic connections</li>
                <li>Multiple story threads that can be discovered in any order</li>
                <li>Themes exploring balance, sustainable existence, and the consequences of extraction</li>
              </ul>
            `,
          gallery: [
            '/api/placeholder/200/150',
            '/api/placeholder/200/150'
          ]
        },
        {
          id: 'tech',
          title: 'Technical Features',
          content: `
              <p>Key technical implementations include:</p>
              <ul>
                <li>Custom HLSL shaders for interactive plant movement and bioluminescence</li>
                <li>Procedural animation system for organic movement of foliage</li>
                <li>Advanced particle systems for energy visualization</li>
                <li>Custom C++ components for the ecological simulation backend</li>
                <li>Optimized LOD system allowing for dense vegetation while maintaining performance</li>
              </ul>
            `,
          gallery: [
            '/api/placeholder/200/150',
            '/api/placeholder/200/150',
            '/api/placeholder/200/150'
          ]
        }
      ]
    },
    {
      id: 'neon-depths',
      name: 'Neon Depths',
      tools: 'Unity, C#, Shader Graph',
      description: 'A stylized underwater roguelike where players navigate bioluminescent deep-sea environments. Features procedural level generation and creature AI that responds to light sources.',
      sections: [
        {
          id: 'mechanics',
          title: 'Core Mechanics',
          content: `
              <p>The underwater movement and light-based mechanics include:</p>
              <ul>
                <li>Physics-based swimming with momentum and current effects</li>
                <li>Light management as both a resource and combat tool</li>
                <li>Procedurally generated cavern systems with varying difficulty</li>
                <li>Stealth mechanics based on light emission levels</li>
              </ul>
            `,
          gallery: [
            '/api/placeholder/200/150',
            '/api/placeholder/200/150'
          ]
        },
        {
          id: 'visual-design',
          title: 'Visual Design',
          content: `
              <p>The deep-sea aesthetic combines realism with stylization:</p>
              <ul>
                <li>Volumetric lighting system for realistic light scattering underwater</li>
                <li>Bioluminescent particle effects for creatures and environment</li>
                <li>Dynamic pressure and depth visualization systems</li>
                <li>Stylized creature designs inspired by real abyssal species</li>
              </ul>
            `,
          gallery: [
            '/api/placeholder/200/150',
            '/api/placeholder/200/150',
            '/api/placeholder/200/150'
          ]
        },
        {
          id: 'progression',
          title: 'Progression System',
          content: `
              <p>The roguelike progression features:</p>
              <ul>
                <li>Upgradable diving equipment with permanent and run-based modifications</li>
                <li>Collectible bioluminescent organisms that provide unique abilities</li>
                <li>Research journal that fills with discoveries and provides passive bonuses</li>
                <li>Depth-based difficulty scaling with unique biomes</li>
              </ul>
            `,
          gallery: [
            '/api/placeholder/200/150',
            '/api/placeholder/200/150'
          ]
        },
        {
          id: 'ai',
          title: 'Creature AI',
          content: `
              <p>The deep-sea creatures feature advanced behavioral systems:</p>
              <ul>
                <li>Light-responsive behavior patterns (attraction, repulsion, hunting)</li>
                <li>Territorial behaviors with dynamic territory mapping</li>
                <li>Creature ecology simulation with predator-prey relationships</li>
                <li>Adaptive difficulty scaling based on player performance</li>
              </ul>
            `,
          gallery: [
            '/api/placeholder/200/150',
            '/api/placeholder/200/150'
          ]
        }
      ]
    }
  ];

  // Generate Project Buttons
  function generateProjectButtons() {
    const buttonContainer = document.getElementById('project-buttons');

    projectsData.forEach(project => {
      const button = document.createElement('button');
      button.textContent = `Open ${project.name}`;
      button.id = `open-${project.id}`;
      button.addEventListener('click', () => openModal(project.id));
      buttonContainer.appendChild(button);
    });
  }

  // Generate Modals
  function generateModals() {
    const modalContainer = document.getElementById('modal-container');

    projectsData.forEach(project => {
      // Create modal container
      const modal = document.createElement('div');
      modal.id = `modal-${project.id}`;
      modal.className = 'modal hidden';

      // Create modal content
      const modalContent = document.createElement('div');
      modalContent.className = 'modal-content';

      // Create close button
      const closeButton = document.createElement('span');
      closeButton.className = 'close-modal';
      closeButton.innerHTML = '&times;';
      closeButton.onclick = () => closeModal(project.id);

      // Create header content
      const title = document.createElement('h2');
      title.textContent = project.name;

      const tools = document.createElement('p');
      tools.innerHTML = `<strong>Tools:</strong> ${project.tools}`;

      const description = document.createElement('p');
      description.textContent = project.description;

      // Create video placeholder
      const videoPlaceholder = document.createElement('div');
      videoPlaceholder.style = 'width: 100%; height: 300px; background-color: #333; border-radius: 0.5rem; margin-top: 1rem; display: flex; justify-content: center; align-items: center;';
      const videoText = document.createElement('p');
      videoText.style = 'color: #777;';
      videoText.textContent = 'Video Preview';
      videoPlaceholder.appendChild(videoText);

      // Create bubbles container
      const bubblesContainer = document.createElement('div');
      bubblesContainer.className = 'project-bubbles';

      // Add bubbles for each section
      project.sections.forEach(section => {
        const bubble = document.createElement('div');
        bubble.className = 'project-bubble';
        bubble.setAttribute('data-project', project.id);
        bubble.setAttribute('data-section', section.id);
        bubble.textContent = section.title;
        bubblesContainer.appendChild(bubble);
      });

      // Add all elements to modal content
      modalContent.appendChild(closeButton);
      modalContent.appendChild(title);
      modalContent.appendChild(tools);
      modalContent.appendChild(description);
      modalContent.appendChild(videoPlaceholder);
      modalContent.appendChild(bubblesContainer);

      // Create mini-modals for each section
      project.sections.forEach(section => {
        const miniModal = document.createElement('div');
        miniModal.id = `mini-modal-${project.id}-${section.id}`;
        miniModal.className = 'mini-modal';

        const miniModalHeader = document.createElement('div');
        miniModalHeader.className = 'mini-modal-header';

        const miniModalTitle = document.createElement('h3');
        miniModalTitle.className = 'mini-modal-title';
        miniModalTitle.textContent = section.title;

        const closeMiniModal = document.createElement('span');
        closeMiniModal.className = 'close-mini-modal';
        closeMiniModal.innerHTML = '&times;';
        closeMiniModal.onclick = () => closeMiniModal(project.id, section.id);

        miniModalHeader.appendChild(miniModalTitle);
        miniModalHeader.appendChild(closeMiniModal);

        const miniModalContent = document.createElement('div');
        miniModalContent.className = 'mini-modal-content';
        miniModalContent.innerHTML = section.content;

        // Create gallery if there are images
        if(section.gallery && section.gallery.length > 0) {
          const gallery = document.createElement('div');
          gallery.className = 'mini-gallery';

          section.gallery.forEach(imgSrc => {
            const img = document.createElement('img');
            img.src = imgSrc;
            img.alt = `${section.title} image`;
            gallery.appendChild(img);
          });

          miniModalContent.appendChild(gallery);
        }

        miniModal.appendChild(miniModalHeader);
        miniModal.appendChild(miniModalContent);
        modalContent.appendChild(miniModal);
      });

      modal.appendChild(modalContent);
      modalContainer.appendChild(modal);
    });

    // Set up event listeners for all bubbles
    setupBubbleListeners();
  }

  // Open Modal
  function openModal(projectId) {
    const modal = document.getElementById(`modal-${projectId}`);
    modal.classList.remove('hidden');
  }

  // Close Modal
  function closeModal(projectId) {
    const modal = document.getElementById(`modal-${projectId}`);
    modal.classList.add('hidden');

    // Close any open mini-modals
    const miniModals = modal.querySelectorAll('.mini-modal');
    miniModals.forEach(miniModal => {
      miniModal.classList.remove('active');
    });

    // Remove active class from all bubbles
    const bubbles = modal.querySelectorAll('.project-bubble');
    bubbles.forEach(bubble => {
      bubble.classList.remove('active');
    });
  }

  // Setup Bubble Listeners
  function setupBubbleListeners() {
    document.querySelectorAll('.project-bubble').forEach(bubble => {
      bubble.addEventListener('click', function() {
        const projectId = this.getAttribute('data-project');
        const sectionId = this.getAttribute('data-section');

        openMiniModal(projectId, sectionId);
      });
    });
  }

  // Open Mini Modal
  function openMiniModal(projectId, sectionId) {
    const modal = document.getElementById(`modal-${projectId}`);

    // Close any open mini-modals first
    const miniModals = modal.querySelectorAll('.mini-modal');
    miniModals.forEach(miniModal => {
      miniModal.classList.remove('active');
    });

    // Remove active class from all bubbles
    const bubbles = modal.querySelectorAll('.project-bubble');
    bubbles.forEach(bubble => {
      bubble.classList.remove('active');
    });

    // Add active class to clicked bubble
    const activeBubble = modal.querySelector(`.project-bubble[data-project="${projectId}"][data-section="${sectionId}"]`);
    activeBubble.classList.add('active');

    // Show the selected mini modal
    const miniModal = document.getElementById(`mini-modal-${projectId}-${sectionId}`);
    miniModal.classList.add('active');

    // Scroll to the mini modal with a smooth animation
    miniModal.scrollIntoView({
      behavior: 'smooth',
      block: 'nearest'
    });
  }

  // Close Mini Modal
  function closeMiniModal(projectId, sectionId) {
    const miniModal = document.getElementById(`mini-modal-${projectId}-${sectionId}`);
    miniModal.classList.remove('active');

    const bubble = document.querySelector(`.project-bubble[data-project="${projectId}"][data-section="${sectionId}"]`);
    bubble.classList.remove('active');
  }

  // Close Modal with Escape key
  window.addEventListener("keydown", function(e) {
    if (e.key === "Escape") {
      const openModals = document.querySelectorAll('.modal:not(.hidden)');
      openModals.forEach(modal => {
        const projectId = modal.id.replace('modal-', '');
        closeModal(projectId);
      });
    }
  });

  // Initialize the page
  document.addEventListener('DOMContentLoaded', function() {
    generateProjectButtons();
    generateModals();

    // Close modal on backdrop click for all modals
    document.querySelectorAll('.modal').forEach(modal => {
      modal.addEventListener('click', function(e) {
        if (e.target === this) {
          const projectId = this.id.replace('modal-', '');
          closeModal(projectId);
        }
      });
    });
  });
</script>
</body>
</html>
