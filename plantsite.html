<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scrolling Vine with Fluttering Leaves</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 200vh; /* To enable scrolling */
      background: #f0fff0;
    }

    #vine-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    #vine {
      width: 100%;
      height: 100%;
    }

    .leaf {
      transform-origin: center;
      animation: grow-leaf 0.5s ease-out forwards;
      opacity: 0;
    }

    @keyframes grow-leaf {
      0% {
        transform: scale(0);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .flutter {
      animation: flutter 3s ease-in-out infinite alternate;
    }

    @keyframes flutter {
      0% {
        transform: scale(1) rotate(-2deg);
      }
      100% {
        transform: scale(1.05) rotate(2deg);
      }
    }

    #content {
      position: relative;
      z-index: 1;
      padding: 2rem;
      font-family: sans-serif;
    }
  </style>
</head>
<body>

<div id="vine-container">
  <svg id="vine" viewBox="0 0 100 100" preserveAspectRatio="none">
    <path id="vinePath" d="M0,100 C30,70 70,30 100,0" stroke="green" stroke-width="1" fill="none" />
  </svg>
</div>

<div id="content">
  <h1>Scroll Down</h1>
  <p>Watch the vine grow diagonally and sprout fluttering leaves as you scroll.</p>
</div>

<script>
  const vinePath = document.getElementById('vinePath');
  const vineSVG = document.getElementById('vine');
  const pathLength = vinePath.getTotalLength();

  vinePath.style.strokeDasharray = pathLength;
  vinePath.style.strokeDashoffset = pathLength;

  const leafSpacing = 5; // smaller value for more frequent leaves
  const leafCount = Math.floor(pathLength / leafSpacing);
  const leaves = [];

  for (let i = 1; i <= leafCount; i++) {
    const leaf = document.createElementNS("http://www.w3.org/2000/svg", "path");
    leaf.setAttribute("d", "M0,-0.5 C0.5,-1 0.5,1 0,0.5 C-0.5,1 -0.5,-1 0,-0.5Z");
    leaf.setAttribute("fill", "limegreen");
    leaf.setAttribute("class", "leaf");
    leaf.style.visibility = "hidden";
    vineSVG.appendChild(leaf);
    leaves.push({ element: leaf, position: i * leafSpacing, shown: false });
  }

  window.addEventListener('scroll', () => {
    const scrollPercent = window.scrollY / (document.body.scrollHeight - window.innerHeight);
    const drawLength = pathLength * scrollPercent;

    vinePath.style.strokeDashoffset = pathLength - drawLength;

    const bbox = vineSVG.getBoundingClientRect();
    const scaleX = bbox.width / 100;
    const scaleY = bbox.height / 100;

    leaves.forEach(leaf => {
      if (!leaf.shown && drawLength >= leaf.position) {
        const point = vinePath.getPointAtLength(leaf.position);
        const screenX = point.x * scaleX;
        const screenY = point.y * scaleY;
        leaf.element.setAttribute('transform', `translate(${screenX},${screenY})`);
        leaf.style.visibility = "visible";
        leaf.shown = true;

        setTimeout(() => {
          leaf.element.classList.add('flutter');
        }, 500);
      }
    });
  });
</script>

</body>
</html>
