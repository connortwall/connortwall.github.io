<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bubble Mask Website</title>

  <!-- Font Awesome CDN -->
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    body {
      margin: 0;
      padding: 0;
      background-image: url('images/backgrounds/pexels-kai-pilger-1341279.jpg'); /* Replace with your actual image path */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed; /* optional: keeps background static on scroll */
      height: 100vh;
      width: 100vw;
      overflow: hidden; /* optional: hides scrollbars if not needed */
      font-family: 'Baron', sans-serif;
    }


    .background-image {
      position: absolute;
      top: 0;
      left: 0;
      transform: rotate(90deg);
      width: 100%;
      height: 100%;
      background: url('images/backgrounds/pexels-kai-pilger-1341279.jpg') no-repeat center center;
      background-size: 200%;
      z-index:1;
      pointer-events: none;
    }

    .custom-bg-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .custom-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      mask-repeat: no-repeat;
      -webkit-mask-repeat: no-repeat;
      mask-size: auto;
      -webkit-mask-size: auto;
      transition: mask-image 0.3s ease, -webkit-mask-image 0.3s ease;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .bubble:hover ~ .custom-bg-container .custom-bg {
      opacity: 0;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 2;
    }

    .mask-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 60;
      pointer-events: none;
    }

    .bubble {
      position: absolute;
      pointer-events: auto;
      border-radius: 50%;
      transition: transform 0.3s ease;
      will-change: transform;
      overflow: hidden;
      z-index: 4;
      mix-blend-mode: screen;
      opacity: 1; /* Make the bubbles semi-visible initially */
      background: rgb(0, 0, 0); /* Add a soft tint to each bubble */
      backdrop-filter: blur(10px);
      box-shadow: 0 0 10px rgba(173, 86, 255, 0.2);
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .bubble img {
      width: 100%;
      height: 100%;
      object-fit: cover;

    }

    .bubble::after {
      content: attr(data-hover-text);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #3375ae;
      font-size: 1rem;
      background: rgba(0, 0, 0, 0.6);
      padding: 0.3rem 0.6rem;
      border-radius: 8px;
      opacity: 1;
      transition: opacity 0.3s ease;
      white-space: wrap;
      pointer-events: none;
      z-index: 2;
    }

    .bubble:hover::after {
      opacity: 1;
      color: rgba(197, 161, 253, 0.94);
    }

    .bubble.touched {
      transform: scale(1.1);
      filter: brightness(1.2);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
      transition: transform 0.2s, filter 0.2s, box-shadow 0.2s;
    }

    .main-bubble {
      width: 300px;
      height: 300px;
      border-radius: 50%;
      overflow: hidden;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      animation: float 6s ease-in-out infinite;
      box-shadow: 0 0 20px rgba(118, 255, 198, 0.87);
    }

    .main-bubble::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(16, 62, 20, 0.4); /* Your overlay color and opacity */
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
      border-radius: 50%;
      pointer-events: none;
    }

    .main-bubble:hover::after {
      opacity: 1;
    }

    .hover-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 1.1rem;
      font-family: 'Baron', sans-serif;
      text-align: center;
      opacity: 0;
      transition: opacity 0.4s ease;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
      pointer-events: none;
      z-index: 2;
    }
    .main-bubble:hover .hover-text {
      opacity: 1;
    }

    .main-bubble img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @font-face {
      font-family: 'Baron';
      src: url('fonts/baron/baron-neue.regular.eot');
      src: url('fonts/baron/baron-neue.regular.eot?#iefix') format('embedded-opentype'),
      url('fonts/baron/baron-neue.regular.woff2') format('woff2'),
      url('fonts/baron/baron-neue.regular.woff') format('woff'),
      url('fonts/baron/baron-neue.regular.ttf') format('truetype'),
      url('fonts/baron/baron-neue.regular.svg#svgFontName') format('svg');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }


    .intro-text {
      position: absolute;
      top: 10%;
      width: 100%;
      text-align: center;
      z-index: 6;
      color: #1bafff;
    }

    .intro-text h1 {
      font-size: 3rem;
      margin: 0;
    }

    .intro-text p {
      font-size: 1.2rem;
      opacity: 0.8;
      margin: 20px;
    }

    .social-icons {
      margin: 1rem 0;
    }

    .social-icons a {
      color: #6cff7a;
      font-size: 1.5rem;
      margin: 0 0.5rem;
      transition: color 0.3s ease, transform 0.3s ease;
      display: inline-block;
    }

    .social-icons a:hover {
      color: #c3efff;
      transform: scale(1.2);
    }

    .card-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;       /* Center horizontally */
      align-items: center;           /* Optional: center vertically within container */
      gap: 2rem;
      position: absolute;           /* Change from absolute */
      margin: 40rem auto;             /* Space above and below */
      padding: 0 2rem;               /* Page-side padding */
      max-width: 1200px;             /* Optional: keeps cards from stretching too wide on large screens */
      z-index: 1; /* Lower the z-index of the cards container so bubbles can be on top */
      pointer-events: none; /* Prevent interactions with cards behind the bubbles */


    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      overflow: hidden;
      width: 250px; /* Base size */
      max-width: 100%; /* Prevent overflow */
      flex: 1 1 200px; /* Allow shrinking/growing */
      height: 200px;
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      pointer-events: auto; /* Allow interaction with individual cards */
      z-index: 5;
    }

    @media (max-width: 768px) {
      .card {
        width: 45%;
        height: 180px;
      }

      .card-container {
        /* Space above and below */
        padding: 0 2rem;
        /* Page-side padding */
      }
      .main-bubble{
        margin-top: 20px;
      }
    }

    @media (max-width: 480px) {
      .card {
        width: 20%;
        height: 160px;
      }
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-title {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      background: rgba(0, 0, 0, 0.6);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 1.2rem;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 20px rgba(255, 255, 255, 0.2);
    }

    .card:hover .card-title {
      opacity: 1;
    }

    .main-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 8;
      position: relative;
      margin-top: 0rem;

    }

    @keyframes float {
      0%, 100% { transform: translate(-50%, -50%) translateY(0px); }
      50% { transform: translate(-50%, -50%) translateY(-20px); }
    }

    /* Position the orb layer in the center of the page, relative to the main bubble */
    .orb-layer {
      position: absolute;
      top: 50%; /* Center vertically */
      left: 50%; /* Center horizontally */
      transform: translate(-50%, -50%); /* Adjust the positioning */
      width: 300px; /* Set fixed width for orb orbit radius */
      height: 300px; /* Set fixed height for orb orbit radius */
      pointer-events: none; /* Prevent interaction with the orb layer itself */
      z-index: 1; /* Make sure the orb layer is above other elements */
    }

    /* Orbs will orbit tightly around the main bubble */
    .orb {
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%; /* Make them circular */
      background-color: rgba(118, 215, 255, 0.9); /* Light blue */
      box-shadow: 0 0 10px rgba(118, 215, 255, 0.62);
      animation: orb-orbit 8s infinite linear; /* Orbit animation */
      pointer-events: auto; /* Allow interaction with orbs */
      z-index: 1; /* Ensure it appears above the main bubble */
    }


    /* Animation for the orbiting orbs around the main bubble */
    @keyframes orb-orbit {
      0% {
        transform: rotate(0deg) translateX(260px) rotate(0deg); /* Tight orbit */
      }
      100% {
        transform: rotate(360deg) translateX(260px) rotate(-360deg); /* Full orbit */
      }
    }

  </style>
</head>
<body>

<div class="background-image"></div>
<div class="custom-bg-container">
  <div class="custom-bg" id="bg1"></div>
  <div class="custom-bg" id="bg2"></div>
  <div class="custom-bg" id="bg3"></div>
  <div class="custom-bg" id="bg4"></div>
  <div class="custom-bg" id="bg5"></div>
</div>
<div class="overlay"></div>
<div class="mask-layer" id="mask-layer"></div>

<div class="intro-text">
  <h1><span style="color: #aef8e7; background-image: linear-gradient(0deg, #aef8e7 0%, #6699FF 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;"> Connor Wall</span></h1>
  <p><span style="color: #c10fb4; background-image: linear-gradient(135deg,#bcf8ae 0%, #bcf8ae 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Making games. Exploring Indigenous futures. Sharing what I learn.</span></p>
  <div class="social-icons">
    <a href="https://bsky.app/profile/quantumconnor.bsky.social" target="_blank" aria-label="Bluesky"><i class="fas fa-cloud"></i></a>
    <a href="https://www.youtube.com/@QuantumAetherGames" target="_blank" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
    <a href="https://www.linkedin.com/in/connortwall/" target="_blank" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
    <a href="https://www.instagram.com/quantum.connor" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
  </div>
</div>

<div class="main-bubble" id="main-bubble" title="CV">
  <div class="hover-text">About</div>
  <a href="https://connorwall.com/CV.html">
    <img src="images/Profile_Photos/Dubrovnik_Profile_Wall.jpg" alt="Main Bubble" />
  </a>
</div>

<div class="main-content">
<div class="card-container">
  <div class="card">
    <a href="https://connorwall.com/Omnivores-Rule.html">
      <img src="uploads/ConnorWall_Portfolio/Game_Design/Omnivores_Rule/Steam-Library-Header.png" alt="Card 1" href="https://connorwall.com/Omnivores-Rule.html"/>
      <div class="card-title">Omnivores Rule</div>
    </a>
  </div>
  <div class="card">
    <a href="https://connorwall.com/Roboleon-Game.html">
      <img src="images/Roboleon.jpg" alt="Card 2" href="https://connorwall.com/Roboleon-Game.html"/>
    </a>
    <div class="card-title">Roboleon</div>
  </div>
  <!--<div class="card">
    <img src="https://via.placeholder.com/250x200" alt="Card 3" />
    <div class="card-title">Project Three</div>
  </div>-->
</div>
</div>
<!-- Footer -->


<script>
  const maskLayer = document.getElementById('mask-layer');
  const bubbles = [];
  const centerX = window.innerWidth / 2;
  const centerY = window.innerHeight / 2;
  const bgImages = [
    'https://i0.wp.com/www.alexbirkett.com/wp-content/uploads/2022/11/iamalexbirkett_jacked_aliens_wandering_through_lord_of_the_ring_0bee4dd7-c4a1-4f73-9b1b-f407f052054f.png?w=828&ssl=1',
    'images/Puppetshow.jpeg',
    'images/coding.jpg',
    '',
    ''
  ];

  const bgDivs = [
    document.getElementById('bg1'),
    document.getElementById('bg2'),
    document.getElementById('bg3'),
    document.getElementById('bg4'),
    document.getElementById('bg5')
  ];

  bgDivs.forEach((div, index) => {
    div.style.backgroundImage = `url('${bgImages[index]}')`;
    div.style.href = 'https://www.linkedin.com/in/connortwall/';
  });



  //orbs
  const orbLayer = document.createElement('div');
  orbLayer.classList.add('orb-layer');
  document.body.appendChild(orbLayer);

  // Center the orb layer on the page
  orbLayer.style.position = 'absolute';
  orbLayer.style.top = '50%';
  orbLayer.style.left = '50%';
  orbLayer.style.transform = 'translate(-50%, -50%)';  // This centers the layer properly
  orbLayer.style.width = '1px';  // Set the width for the orbit radius
  orbLayer.style.height = '1px';  // Set the height for the orbit radius
  orbLayer.style.pointerEvents = 'none';
  orbLayer.style.zIndex = '2';

  for (let i = 0; i < 5; i++) {
    const orb = document.createElement('div');
    orb.classList.add('orb');

    // Randomize the color and other properties
    orb.style.backgroundColor = `rgba(118, 215, 255, 0.${Math.random() * 8 + 2})`;
    const size = 20 + Math.random() * 10;
    orb.style.width = `${size}px`;
    orb.style.height = `${size}px`;

    // Set the initial angle for each orb
    const angle = Math.random() * 360;
    orb.style.animationDuration = `${8 + Math.random() * 4}s`;  // Randomize orbit speed

    // Position the orb using a radial animation
    orb.style.transform = `rotate(${angle}deg) translateX(2px) rotate(-${angle}deg)`;  // Start position

    // Append the orb to the orb layer
    orbLayer.appendChild(orb);
  }

  for (let i = 0; i < 4; i++) {
    const bubble = document.createElement('div');
    bubble.classList.add('bubble');
    switch (i) {
      case 0:
        bubble.dataset.hoverText = 'Visuals';
        bubble.style.href = 'visualdesign.html';
        break;
      case 1:
        bubble.dataset.hoverText = 'Game Dev';
        bubble.style.href = 'gamedesign.html';
        break;
      case 2:
        bubble.dataset.hoverText = 'Written Work';
        bubble.style.href = 'writtenwork.html';
        break;
      case 3:
        bubble.dataset.hoverText = 'Organizer';
        bubble.style.href = 'https://www.linkedin.com/in/connortwall/';

        break;
      case 4: bubble.dataset.hoverText = '';
        break;
    }

    bubble.addEventListener('mouseenter', () => {
      bgDivs[i].style.opacity = '1';
      bubble.style.background = 'images/gamedesign.png';
      bubble.img.background = 'images/gamedesign.png';
    });
    bubble.addEventListener('mouseleave', () => {
      bgDivs[i].style.opacity = '0';
    });
    bubble.addEventListener('click', () => {
      window.open(bubble.style.href, '_self');
    });
    // Touch start
    bubble.addEventListener('touchstart', () => {
      bubble.classList.add('touched');
    });

    // Touch end
    bubble.addEventListener('touchend', () => {
      // Delay the removal slightly for visual effect
      setTimeout(() => {
        bubble.classList.remove('touched');
      }, 150);
    });

    // Optional: tap anywhere else to remove visual feedback
    document.addEventListener('touchstart', (e) => {
      if (!bubble.contains(e.target)) {
        bubble.classList.remove('touched');
      }
    });

    const size = 90 + Math.random() * 120;
    bubble.style.width = `${size}px`;
    bubble.style.height = `${size}px`;


    const mask = `radial-gradient(circle ${size / 2}px at center, white 100%, white 100%)`;
    bgDivs[i].style.maskImage = mask;
    bgDivs[i].style.webkitMaskImage = mask;


    maskLayer.appendChild(bubble);

    bubbles.push({
      el: bubble,
      size,
      baseRadius: 100 + Math.random() * 220 - innerWidth/1000,
      angle: Math.random() * 360,
      wobbleOffset: Math.random() * 100,
      <!--rotateSpeed: 0.3 + Math.random() * 0.3,-->
      bgDiv: bgDivs[i],
      <!--rotateSpeed: 0.3 + Math.random() * 0.3-->
    });
  }

  let time = 0;
  function animate() {
    time += 0.01;
    bubbles.forEach((b, i) => {
      const wobble = Math.sin(time * 2 + b.wobbleOffset) * 10;
      const radius = (b.baseRadius + wobble);
      b.angle += 0.002 + i * 0.0015;

      const x = centerX + Math.cos(b.angle) * radius;
      const y = centerY + Math.sin(b.angle) * radius;

      b.el.style.left = `${x - b.size / 2}px`;
      b.el.style.top = `${y - b.size / 2}px`;
      b.el.style.transform = `rotate(${time * b.rotateSpeed}rad)`;

      const mask = `radial-gradient(circle ${b.size / 2}px at ${x}px ${y}px, white 100%, white 100%)`;

      b.bgDiv.style.webkitMaskImage = mask;
      b.bgDiv.style.maskImage = mask;





    });
    requestAnimationFrame(animate);
  }

  animate();
</script>
</body>
</html>
